name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ResolveOps.slnx

      - name: Verify formatting
        run: dotnet format ResolveOps.slnx --verify-no-changes

      - name: Build (warnings as errors)
        run: dotnet build ResolveOps.slnx --configuration Release --no-restore

      - name: Architecture tests
        run: dotnet test tests/ResolveOps.ArchitectureTests --configuration Release --no-build --verbosity normal

      - name: Integration tests
        # Testcontainers uses Docker-in-Docker on GitHub Actions ubuntu runners (Docker is pre-installed)
        run: dotnet test tests/ResolveOps.IntegrationTests --configuration Release --no-build --verbosity normal
        env:
          # Testcontainers needs these on GitHub Actions
          TESTCONTAINERS_RYUK_DISABLED: false

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.xml
            **/TestResults/*.trx
          retention-days: 7
